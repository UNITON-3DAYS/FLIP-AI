# 로컬/서버 공통 실행. Spring과 같은 박스에 올릴 때도 이 파일을 쓴다.
#   cp .env.example .env  →  값 채우기  →  docker compose up --build
services:
  flip:
    build: .
    # 로컬은 기본값으로 빌드, 서버(CD)는 FLIP_DOCKER_IMAGE로 DockerHub 이미지를 당겨 쓴다.
    image: ${FLIP_DOCKER_IMAGE:-flip-ai:latest}
    ports:
      - "8000:8000"
    # 실제 키(FLIP_VLM_API_KEY 등)는 .env로 주입. 없으면 무시하고 뜬다(채점은 보류).
    env_file:
      - path: .env
        required: false
    environment:
      # 정답 JSON은 저작권 자료라 이미지에 안 넣고 볼륨으로 주입한다.
      FLIP_ANSWER_BACKEND: ${FLIP_ANSWER_BACKEND:-json}
      FLIP_ANSWER_DIR: /answers
    volumes:
      # 호스트의 정답 디렉터리(기본 ./answers)를 읽기전용으로 마운트.
      - ${FLIP_ANSWER_HOST_DIR:-./answers}:/answers:ro
    restart: unless-stopped
    networks:
      - flip-net

networks:
  flip-net:
    external: true
